name: macOS

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rumps==0.4.0
      - run: PYTHONPATH=macos python -m unittest discover -s macos/tests -v
      - run: PYTHONPATH=macos python -c "import rumps, AppKit; import quota_panel.app"
      - run: PYTHONPATH=macos python -c "from quota_panel.app import QuotaPanel; QuotaPanel()"
      - run: PYTHONPATH=macos python -c "from quota_panel.launchagent import plist; import plistlib, pathlib; pathlib.Path('macos/test.plist').write_bytes(plistlib.dumps(plist('/tmp/python'))); plistlib.loads(pathlib.Path('macos/test.plist').read_bytes())"
      - run: plutil -lint macos/test.plist
      - run: rm macos/test.plist
      - run: sh -n macos/install.sh
      - run: sh -n macos/uninstall.sh
